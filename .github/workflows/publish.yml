name: Publish V.E.R.A.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        working-directory: desktop
        run: npm ci

      - name: Build Python sidecar
        shell: pwsh
        run: |
          python -m pip install -r requirements-build.txt
          .\scripts\build-tauri-backend.ps1 -Python (Get-Command python).Source

      - name: Build and publish signed release artifacts
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          projectPath: desktop
          tagName: v__VERSION__
          releaseName: V.E.R.A. v__VERSION__
          releaseBody: See the release notes for this version.
          releaseDraft: true
          prerelease: false
          args: --bundles nsis
